<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">ScamShield product workflow</title><desc id="desc">Three connected steps: paste suspicious content, inspect explainable warning signals, and take a safer next step.</desc>
<defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#172724"/><stop offset="1" stop-color="#213b33"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b4f2d7"/><stop offset="1" stop-color="#58c39a"/></linearGradient></defs>
<rect width="1200" height="420" rx="24" fill="#101a19"/><text x="62" y="64" fill="#b5f0d4" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="4">A SIMPLE SAFETY WORKFLOW</text>
<g font-family="Arial,sans-serif"><g transform="translate(55 108)"><rect width="320" height="250" rx="18" fill="url(#card)" stroke="#436a59"/><circle cx="48" cy="48" r="23" fill="#b5f0d4"/><text x="48" y="56" text-anchor="middle" font-size="22" font-weight="700" fill="#16392b">1</text><text x="30" y="105" fill="#f2f8f4" font-size="24" font-weight="700">Paste it in</text><text x="30" y="142" fill="#b8ccc1" font-size="16">A suspicious URL, email,</text><text x="30" y="167" fill="#b8ccc1" font-size="16">SMS, or chat message.</text><rect x="30" y="195" width="260" height="30" rx="7" fill="#0d1715" stroke="#547767"/><path d="M47 210h170" stroke="#83b99e" stroke-width="3" stroke-linecap="round"/></g><path d="M390 232h34m-10-10 10 10-10 10" stroke="#83cba8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(440 108)"><rect width="320" height="250" rx="18" fill="url(#card)" stroke="#436a59"/><circle cx="48" cy="48" r="23" fill="#b5f0d4"/><text x="48" y="56" text-anchor="middle" font-size="22" font-weight="700" fill="#16392b">2</text><text x="30" y="105" fill="#f2f8f4" font-size="24" font-weight="700">See the signals</text><text x="30" y="142" fill="#b8ccc1" font-size="16">A score, verdict, evidence,</text><text x="30" y="167" fill="#b8ccc1" font-size="16">and plain-language reasons.</text><rect x="30" y="196" width="260" height="10" rx="5" fill="#344b42"/><rect x="30" y="196" width="176" height="10" rx="5" fill="url(#accent)"/><text x="30" y="229" fill="#9ccbb2" font-size="13">EXPLAINABLE RULES</text></g><path d="M775 232h34m-10-10 10 10-10 10" stroke="#83cba8" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(825 108)"><rect width="320" height="250" rx="18" fill="url(#card)" stroke="#436a59"/><circle cx="48" cy="48" r="23" fill="#b5f0d4"/><text x="48" y="56" text-anchor="middle" font-size="22" font-weight="700" fill="#16392b">3</text><text x="30" y="105" fill="#f2f8f4" font-size="24" font-weight="700">Choose safely</text><text x="30" y="142" fill="#b8ccc1" font-size="16">Verify through a trusted</text><text x="30" y="167" fill="#b8ccc1" font-size="16">channel before you respond.</text><circle cx="53" cy="210" r="13" fill="#b5f0d4"/><path d="m47 210 5 5 8-10" stroke="#17392c" stroke-width="3" fill="none" stroke-linecap="round"/><text x="78" y="216" fill="#a6e8c7" font-size="14">DON'T SHARE OTPs OR PASSWORDS</text></g></g></svg>