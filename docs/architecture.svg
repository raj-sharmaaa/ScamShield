<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
<title id="title">ScamShield system architecture</title><desc id="desc">Firebase, Supabase and Clerk provide identity tokens to a Next.js browser app. FastAPI verifies tokens, maps identities to an internal user, and scopes PostgreSQL data. The API also runs the explainable detector.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b19"/><stop offset="1" stop-color="#172a24"/></linearGradient><linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#baf5d9"/><stop offset="1" stop-color="#69c99e"/></linearGradient></defs>
<rect width="1200" height="610" rx="24" fill="url(#bg)"/><text x="54" y="58" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="4" fill="#a8e8c6">SCAMSHIELD / SYSTEM DESIGN</text>
<g font-family="Arial,sans-serif"><g transform="translate(52 100)"><rect width="250" height="320" rx="18" fill="#1d3029" stroke="#4b8068"/><text x="22" y="38" font-size="16" font-weight="700" fill="#eaf7ef">IDENTITY PROVIDERS</text><g transform="translate(18 62)"><rect width="214" height="58" rx="10" fill="#263f34"/><circle cx="29" cy="29" r="13" fill="#f2a84b"/><text x="54" y="35" font-size="17" fill="#f4f8f5">Firebase Auth</text></g><g transform="translate(18 134)"><rect width="214" height="58" rx="10" fill="#263f34"/><circle cx="29" cy="29" r="13" fill="#59b9a7"/><text x="54" y="35" font-size="17" fill="#f4f8f5">Supabase Auth</text></g><g transform="translate(18 206)"><rect width="214" height="58" rx="10" fill="#263f34"/><circle cx="29" cy="29" r="13" fill="#9a8df5"/><text x="54" y="35" font-size="17" fill="#f4f8f5">Clerk</text></g></g>
<path d="M310 260h45m-12-9 12 9-12 9" fill="none" stroke="#9fe8c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="312" y="235" font-size="12" fill="#9fc6b2">signed JWT</text>
<g transform="translate(365 100)"><rect width="250" height="320" rx="18" fill="#1c2b32" stroke="#5e8991"/><text x="22" y="38" font-size="16" font-weight="700" fill="#eaf7ef">NEXT.JS WEB APP</text><rect x="20" y="65" width="210" height="72" rx="10" fill="#263e45"/><text x="36" y="94" font-size="17" fill="#f4f8f5">Sign-in panel</text><text x="36" y="117" font-size="12" fill="#a9c7c8">provider SDK sessions</text><rect x="20" y="153" width="210" height="72" rx="10" fill="#263e45"/><text x="36" y="182" font-size="17" fill="#f4f8f5">Scan dashboard</text><text x="36" y="205" font-size="12" fill="#a9c7c8">URL · Email · Message</text><text x="20" y="270" font-size="13" fill="#a9c7c8">Vercel deployment</text></g>
<path d="M623 260h45m-12-9 12 9-12 9" fill="none" stroke="#9fe8c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="621" y="235" font-size="12" fill="#9fc6b2">Bearer token</text>
<g transform="translate(675 100)"><rect width="250" height="320" rx="18" fill="#26342c" stroke="#84b89b"/><text x="22" y="38" font-size="16" font-weight="700" fill="#eaf7ef">FASTAPI SERVICE</text><rect x="20" y="65" width="210" height="72" rx="10" fill="#304a3c"/><text x="36" y="94" font-size="17" fill="#f4f8f5">JWT verification</text><text x="36" y="117" font-size="12" fill="#b8d8c5">issuer · audience · JWKS</text><rect x="20" y="153" width="210" height="72" rx="10" fill="#304a3c"/><text x="36" y="182" font-size="17" fill="#f4f8f5">Identity mapping</text><text x="36" y="205" font-size="12" fill="#b8d8c5">explicit account linking</text><rect x="20" y="241" width="210" height="52" rx="10" fill="#304a3c"/><text x="36" y="273" font-size="16" fill="#f4f8f5">Rules-based detector</text></g>
<path d="M933 260h45m-12-9 12 9-12 9" fill="none" stroke="#9fe8c4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="931" y="235" font-size="12" fill="#9fc6b2">user_id scoped</text>
<g transform="translate(985 100)"><rect width="165" height="320" rx="18" fill="#1c2c35" stroke="#7b9ca9"/><text x="18" y="38" font-size="16" font-weight="700" fill="#eaf7ef">DATA</text><rect x="16" y="68" width="133" height="78" rx="10" fill="#29424a"/><text x="28" y="99" font-size="16" fill="#f4f8f5">PostgreSQL</text><text x="28" y="121" font-size="11" fill="#b7cbd0">users · scans</text><rect x="16" y="160" width="133" height="78" rx="10" fill="#29424a"/><text x="28" y="191" font-size="16" fill="#f4f8f5">Identity links</text><text x="28" y="213" font-size="11" fill="#b7cbd0">provider + subject</text><text x="18" y="274" font-size="12" fill="#b7cbd0">Optional Redis</text><text x="18" y="292" font-size="11" fill="#b7cbd0">shared rate limits</text></g>
<rect x="52" y="470" width="1098" height="82" rx="14" fill="#1c2d26" stroke="#436d58"/><circle cx="88" cy="511" r="17" fill="url(#mint)"/><path d="m80 511 6 6 11-13" fill="none" stroke="#173a2b" stroke-width="3" stroke-linecap="round"/><text x="120" y="503" font-size="17" font-weight="700" fill="#eaf7ef">Privacy boundary</text><text x="120" y="528" font-size="14" fill="#b5cec0">Emails do not merge accounts. A second provider is linked only with an active session and a verified second token.</text></g></svg>