services:
  - type: web
    name: scamshield-api
    runtime: docker
    plan: starter
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scamshield-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: ALLOW_UNAUTHENTICATED_STORAGE
        value: "false"
      - key: AI_ANALYSIS_ENABLED
        value: "false"

databases:
  - name: scamshield-db
    plan: basic-256mb
    databaseName: scamshield
    user: scamshield
